<script>
    let eyeDropper;


    function eye_dropper() {
        if (!eyeDropper) {
            eyeDropper = new window.EyeDropper();
        }

        eyeDropper
            .open()
            .then((colorSelectionResult) => {
                console.log('Selected color:', colorSelectionResult.sRGBHex);
                navigator.clipboard.writeText(colorSelectionResult.sRGBHex)
            })
            .catch((error) => {
                console.error('Error:', error);
            });
    }
</script>
